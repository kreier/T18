name = "t18-telemetry-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
GITHUB_OWNER = "kreier"
GITHUB_REPO = "T18"
GITHUB_BRANCH = "main"

# Cloudflare KV binding for real-time live telemetry & hourly buffer:
# Run: npx wrangler kv namespace create TELEMETRY_KV
# Then paste the generated id below:
# [[kv_namespaces]]
# binding = "TELEMETRY_KV"
# id = "YOUR_KV_NAMESPACE_ID"

# Secrets configured via `wrangler secret put`:
# wrangler secret put AUTH_TOKEN
# wrangler secret put GITHUB_TOKEN
