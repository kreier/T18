name = "t18"
main = "src/index.ts"
compatibility_date = "2024-05-01"
account_id = "040d4484a381ab7d4920bc1983b15f3d"
workers_dev = true

[vars]
ENVIRONMENT = "production"
STABLE_VERSION = "1.1.3"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "hcmue.edu.vn"

[observability.logs]
enabled = true
invocation_logs = true

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "t18-mon-db"
database_id = "9526b47c-4fa7-41cc-8cc5-ba5b2bd8cf4f"
migrations_dir = "migrations"

# Cron trigger: Runs every day at 00:15 UTC for 30-day data rotation & daily summarization
[triggers]
crons = ["15 0 * * *"]
