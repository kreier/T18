; PlatformIO Project Configuration File for flynn0/T18
; Version: 1.1.0
; https://github.com/flynn0/T18
;
; Single Unified ESP32 Binary:
; Hardware targets (T18, T8, DevKit V1, Custom) are configured at runtime via NVS.
; Dual OTA support with 1.9MB application slots and 190KB raw offline data partition.

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FIRMWARE_VERSION=\"1.1.0\"
